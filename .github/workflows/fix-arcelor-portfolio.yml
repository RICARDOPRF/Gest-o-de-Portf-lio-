name: Fix Arcelor Portfolio Summary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-arcelor-portfolio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Arcelor summary integration
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          novo_card = r'''function atualizarCard(id, avancoRealAcm, hhRealAcm, prodAcm, dataInicio='', dataFim='') {
              const perc = Math.max(0, avancoRealAcm || 0);
              document.getElementById(`${id}-perc-txt`).innerText = formatPerc(perc, 2);
              document.getElementById(`${id}-bar`).style.width = Math.min(100, perc * 100) + "%";
              document.getElementById(`${id}-hh`).innerText = formatHH(hhRealAcm);

              const prodEl = document.getElementById(`${id}-prod`);
              const prodBox = document.getElementById(`${id}-prod-box`);
              const produtividadeDisponivel = prodAcm !== null && prodAcm !== undefined && Number.isFinite(Number(prodAcm));

              if (!produtividadeDisponivel) {
                  prodEl.innerText = "–";
                  prodEl.className = "text-sm font-black text-slate-400";
                  prodBox.style.borderLeftColor = "#94a3b8";
              } else {
                  const produtividadeNumero = Number(prodAcm);
                  prodEl.innerText = produtividadeNumero.toFixed(1) + "%";
                  if (produtividadeNumero < 100) {
                      prodEl.className = "text-sm font-black text-red-600";
                      prodBox.style.borderLeftColor = "#ef4444";
                  } else {
                      prodEl.className = "text-sm font-black text-green-600";
                      prodBox.style.borderLeftColor = "#10b981";
                  }
              }

              atualizarStatusProjeto(id, perc, dataInicio, dataFim);
          }'''

          s, n = re.subn(
              r"function atualizarCard\(id, avancoRealAcm, hhRealAcm, prodAcm, dataInicio='', dataFim=''\) \{.*?\n\}\n\n(?=function listaFirebase)",
              lambda m: novo_card + "\n\n",
              s,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f'Falha ao substituir atualizarCard: {n}')

          novo_resumo = r'''function calcularResumoPainel(data, id='') {
              // Etanol usa a mesma regra dinâmica de consolidação do painel interno.
              if (id === 'fs-cnp-etanol') return calcularResumoEtanol(data);

              // O cartão do BECCS precisa seguir exatamente a regra do painel interno,
              // que exclui as disciplinas de detalhe da consolidação geral.
              if (id === 'syngenta') return calcularResumoBeccs(data);

              const cfg = data.config || {};
              const disciplinasCfg = cfg.disciplinas || {};
              const dadosPorDisciplina = data.dados || null;
              const projetoArcelor = id === 'regenerador' || id === 'forno-panela';

              // Estrutura de painéis multidisciplinares: painel/dados/{disciplina}/curva e painel/dados/{disciplina}/hh
              if (dadosPorDisciplina && typeof dadosPorDisciplina === 'object') {
                  let hhContratoTotal = 0;
                  let hhContratoComCurva = 0;
                  let hhAgregadoTotal = 0;
                  let hhRealTotal = 0;
                  let temCurva = false;
                  const avancosComCurva = [];

                  Object.keys(dadosPorDisciplina).forEach(key => {
                      const cfgDisc = disciplinasCfg[key] || {};
                      if (cfgDisc.ativo === false) return;

                      const hhContratoDisc = Number(cfgDisc.hh) || 0;
                      hhContratoTotal += hhContratoDisc;

                      const curva = listaFirebase(dadosPorDisciplina[key]?.curva);
                      const hh = listaFirebase(dadosPorDisciplina[key]?.hh);

                      const avancoRealDisc = curva.reduce((a, c) => {
                          return a + valorPercentual(c.Avanco_Realizado_Perc ?? c.Realizado ?? c.Percentual_Real ?? c['% Real']);
                      }, 0);

                      if (curva.length) {
                          temCurva = true;
                          avancosComCurva.push(avancoRealDisc);
                          hhContratoComCurva += hhContratoDisc;
                          hhAgregadoTotal += avancoRealDisc * hhContratoDisc;
                      }

                      hhRealTotal += hh.reduce((a, c) => a + numeroPlanilha(c.HH_Real ?? c['HH Real'] ?? c.HH), 0);
                  });

                  const contratoBase = hhContratoTotal || hhContratoComCurva || Number(cfg.hh) || 0;
                  const possuiPesoHHValido = hhContratoComCurva > 0;
                  const avancoMedioSemHH = avancosComCurva.length
                      ? avancosComCurva.reduce((soma, valor) => soma + valor, 0) / avancosComCurva.length
                      : 0;

                  // Os painéis Arcelor ainda possuem Curva S real, mas HH contratual por disciplina zerado.
                  // Sem peso HH válido, usa peso uniforme entre as disciplinas com curva, como fallback do painel geral.
                  const avancoProjeto = possuiPesoHHValido && contratoBase > 0
                      ? hhAgregadoTotal / contratoBase
                      : (projetoArcelor ? avancoMedioSemHH : 0);

                  // Sem HH Real não há base matemática para produtividade; no Arcelor mostramos "–" em vez de 0%.
                  const produtividade = hhRealTotal > 0 && possuiPesoHHValido
                      ? (hhAgregadoTotal / hhRealTotal) * 100
                      : (projetoArcelor ? null : 0);

                  return {
                      avancoRealAcm: temCurva ? avancoProjeto : 0,
                      hhRealAcm: hhRealTotal,
                      prodAcm: produtividade,
                      dataInicio: cfg.inicio || '',
                      dataFim: cfg.fim || ''
                  };
              }

              // Estrutura antiga: painel/curva e painel/hh
              const curvaLegada = listaFirebase(data.curva);
              const hhLegado = listaFirebase(data.hh);
              const hhContrato = Number(cfg.hh) || 0;
              const avancoRealAcm = curvaLegada.reduce((a, c) => {
                  return a + valorPercentual(c.Avanco_Realizado_Perc ?? c.Realizado ?? c.Percentual_Real ?? c['% Real']);
              }, 0);
              const hhRealAcm = hhLegado.reduce((a, c) => a + numeroPlanilha(c.HH_Real ?? c['HH Real'] ?? c.HH), 0);
              const prodAcm = hhRealAcm > 0 ? ((avancoRealAcm * hhContrato) / hhRealAcm) * 100 : (projetoArcelor ? null : 0);

              return {
                  avancoRealAcm,
                  hhRealAcm,
                  prodAcm,
                  dataInicio: cfg.inicio || '',
                  dataFim: cfg.fim || ''
              };
          }'''

          s, n = re.subn(
              r"function calcularResumoPainel\(data, id=''\) \{.*?\n\}\n\n(?=function iniciarConexao)",
              lambda m: novo_resumo + "\n\n",
              s,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f'Falha ao substituir calcularResumoPainel: {n}')

          p.write_text(s, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          grep -q "const projetoArcelor = id === 'regenerador' || id === 'forno-panela';" index.html
          grep -q 'const avancoMedioSemHH' index.html
          grep -q 'prodEl.innerText = "–";' index.html
          grep -q 'projetoArcelor ? null : 0' index.html

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige avanço e produtividade dos painéis Arcelor"
          git push origin main
