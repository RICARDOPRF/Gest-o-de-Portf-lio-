<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Administrativa | Painéis de Bordo</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f6fa;color:#18398f}
    .boot{min-height:100vh;display:grid;place-items:center}.boot-box{text-align:center;font-weight:700}.boot-spin{width:34px;height:34px;margin:0 auto 14px;border:4px solid #dbe7ff;border-top-color:#2563eb;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><div class="boot-box"><div class="boot-spin"></div>Carregando Central Executiva...</div></div>
  <script>
  (async function(){
    try{
      const response=await fetch('./central-administrativa-paineis-base.html?v=20260905-qty2',{cache:'no-cache'});
      if(!response.ok)throw new Error('Falha ao carregar base da central');
      let html=await response.text();
      const addon='<script src="./central-quantitativos-addon.js?v=20260905-qty2"></scr'+'ipt>';
      html=html.replace('</body>',addon+'</body>');
      document.open();document.write(html);document.close();
    }catch(error){
      document.body.innerHTML='<div style="padding:40px;font-family:Arial"><h2>Não foi possível carregar a Central Administrativa</h2><p>'+String(error.message||error)+'</p></div>';
    }
  })();
  </script>
</body>
</html>
